name: Deploy Cilentomania HUB su Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned build and local database test dependencies
        run: |
          npm ci --prefix tools/auth-sdk --ignore-scripts
          npm ci --prefix supabase/tests --ignore-scripts

      - name: Security and regression checks
        run: |
          node tools/check-operator-auth.cjs
          node tools/check-operator-backend.cjs
          node tools/check-operator-area.cjs
          node tools/check-operator-types.cjs
          node tools/check-operator-online.cjs
          node tools/check-operator-media.cjs
          node tools/check-operator-profile.cjs
          node tools/check-i18n-keys.js
          node tools/check-cileo-conversations.cjs
          npm test --prefix supabase/tests

      - name: Build public allowlisted package
        run: node tools/build-public.cjs

      - name: Deploy su Aruba via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www.cilentomania.it/hub/
          local-dir: ./_site/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/config.local.json
            review-cilentino/**
            temp-*.png
            supabase/**
            tests/**
            **/.env*
            package.json
            package-lock.json
            docs/**
            tools/**
            seo/**
            README.md
            .gitignore
            *.ps1
